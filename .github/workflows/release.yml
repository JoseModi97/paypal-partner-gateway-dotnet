name: Release to NuGet

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Pack
        run: |
          dotnet pack src/PayPal.PartnerGateway/PayPal.PartnerGateway.csproj -c Release -o ./artifacts
          dotnet pack src/PayPal.PartnerGateway.AspNetCore/PayPal.PartnerGateway.AspNetCore.csproj -c Release -o ./artifacts
          dotnet pack src/PayPal.PartnerGateway.Cli/PayPal.PartnerGateway.Cli.csproj -c Release -o ./artifacts

      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
