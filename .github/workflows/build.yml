name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore PayPal.PartnerGateway.sln

      - name: Build
        run: dotnet build PayPal.PartnerGateway.sln --no-restore -c Release

      - name: Test
        run: dotnet test tests/PayPal.PartnerGateway.Tests/PayPal.PartnerGateway.Tests.csproj --no-build -c Release
